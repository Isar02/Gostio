name: gostio_desktop
description: Gostio desktop client for administrators and hosts.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  dio: ^5.11.0
  file_picker: ^12.1.2
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  intl: ^0.20.2
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  provider: ^6.1.5+1
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Geist-OFL.txt
    - assets/fonts/Manrope-OFL.txt
    - assets/fonts/PlusJakartaSans-OFL.txt

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
